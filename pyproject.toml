[build-system]
requires = ['setuptools>=68.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'scholar-agent-v2'
version = '0.2.0'
description = 'V2 academic paper query understanding, retrieval, and candidate ranking pipeline'
requires-python = '>=3.11'
dependencies = [
    'openai>=1.0',
    'pydantic>=2.0',
    'python-dotenv>=1.0',
    'numpy>=2.1',
    'sentence-transformers>=5.0',
]

[project.optional-dependencies]
dev = ['pytest>=8.0', 'mypy>=1.0']

[tool.setuptools.packages.find]
where = ['src']
